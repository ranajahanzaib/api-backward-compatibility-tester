name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check breaking contract fixture
        run: |
          if cargo run -p api-compat -- spec diff --old examples/ecommerce-api/openapi/baseline.yaml --new examples/ecommerce-api/openapi/candidate.yaml; then
            echo "breaking fixture unexpectedly passed"
            exit 1
          else
            code=$?
            test "$code" -eq 2
          fi
      - name: Check compatible contract fixture
        run: cargo run -p api-compat -- spec diff --old examples/ecommerce-api/openapi/baseline.yaml --new examples/ecommerce-api/openapi/compatible.yaml
