openapi: 3.1.0
info: { title: Example Store API, version: 1.0.0 }
paths:
  /health:
    get:
      responses:
        "200":
          {
            description: Healthy,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { status: { type: string } },
                        required: [status],
                      },
                  },
              },
          }
  /v2/status:
    get:
      responses:
        "200":
          {
            description: Versioned health details,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { status: { type: string } },
                        required: [status],
                      },
                  },
              },
          }
  /customers/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Customer profile,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Customer" } },
              },
          }
        "422":
          {
            description: Invalid identifier,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
  /customers:
    get:
      parameters:
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: region, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          {
            description: Customer page,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CustomerPage" } },
              },
          }
  /orders/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Order,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Order" } },
              },
          }
  /orders:
    get:
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
  /products/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Product,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
components:
  schemas:
    Customer:
      type: object
      required: [customer_id, name, status]
      properties:
        customer_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        loyalty_tier: { type: string }
    CustomerPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          {
            type: array,
            items:
              {
                type: object,
                required: [id],
                properties: { id: { type: string } },
              },
          }
        pagination:
          { type: object, properties: { next_cursor: { type: string } } }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          {
            type: object,
            required: [code, message],
            properties: { code: { type: string }, message: { type: string } },
          }
    Order:
      type: object
      required: [id, status, total]
      properties:
        id: { type: string }
        status: { type: string, enum: [paid, cancelled] }
        total: { type: number }
    Product:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
